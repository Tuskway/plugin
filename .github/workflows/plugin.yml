name: plugin

# Static package checks only. This workflow has no push trigger and no
# pull-request trigger, and it does not select a GitHub-hosted runner. A manual
# run waits for a self-hosted runner labeled tuskway. Until that runner
# exists, run these commands locally:
#   node --test scripts/test-plugin.mjs
#   node scripts/sync.mjs --check
#   node scripts/validate.mjs
# They do not install a client and they do not prove OAuth or routing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on:
      - self-hosted
      - tuskway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/test-plugin.mjs
      - run: node scripts/sync.mjs --check
      - run: node scripts/validate.mjs
