name: plugin

# Manual package checks. No push or pull_request trigger.
# A run waits for a self-hosted runner labeled tuskway.
# Locally:
#   node --test scripts/test-plugin.mjs
#   node scripts/sync.mjs --check
#   node scripts/validate.mjs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on:
      - self-hosted
      - tuskway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/test-plugin.mjs
      - run: node scripts/sync.mjs --check
      - run: node scripts/validate.mjs
